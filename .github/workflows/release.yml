name: Release

# 触发方式：
#   1. 推送 v* 标签（如 git tag v1.9.8 && git push origin main --tags）
#   2. 在 Actions 页面手动 Run workflow（配合已存在的 tag，用 tagName 字段）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: write-all # 创建 Release + 上传安装包（tauri-action 需要 contents 写权限）

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false # 一个平台失败不阻塞其他平台
      matrix:
        include:
          # macOS：仅 Apple Silicon (aarch64)，只产出 DMG 安装包
          - platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
          # Windows：NSIS 安装包
          - platform: windows-latest
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    env:
      # 是否配置了 Apple Developer 签名凭据（未配置时自动回退为 ad-hoc 签名）
      # 注意：不能直接把空字符串的 secrets 塞给 tauri —— 空 APPLE_ID/APPLE_PASSWORD/
      # APPLE_TEAM_ID 会被 tauri 当作"已配置公证凭据"导致公证失败、构建报错
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js (24)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # macOS 构建需要 aarch64 target
      - name: Add macOS targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # macOS 签名 + 公证（官方流程，见 https://v2.tauri.app/distribute/sign/macos/）
      # 仅在配置了 APPLE_* secrets 时执行；未配置则使用 tauri.conf.json 的 ad-hoc 签名
      - name: Import Apple Developer Certificate
        if: matrix.platform == 'macos-latest' && env.HAS_APPLE_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p build build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p build build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k build build.keychain
          security find-identity -v -p codesigning build.keychain
          # 导出给 tauri 读取：签名身份（覆盖 tauri.conf.json 的 ad-hoc）+ 公证凭据
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
          echo "APPLE_PASSWORD=$APPLE_PASSWORD" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"

      - name: Build and upload to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: NexaShell ${{ github.ref_name }}
          releaseBody: |
            ## NexaShell ${{ github.ref_name }}

            自动构建产物，选择对应平台的安装包下载：

            - **macOS**：`NexaShell_${{ github.ref_name }}_aarch64.dmg`（Apple Silicon）
            - **Windows**：`NexaShell_${{ github.ref_name }}_x64-setup.exe`

            ### macOS 打开说明

            - **已签名/公证**（仓库配置了 `APPLE_*` secrets）：可直接双击打开，无任何提示。
            - **ad-hoc 签名**（未配置 secrets）：首次打开若提示"无法验证开发者"，右键应用 →「打开」→ 再点「打开」，或在 系统设置 → 隐私与安全性 中点「仍要打开」。
            - 若提示「已损坏，无法打开」，在终端执行一次（移除隔离属性）：
              ```bash
              xattr -cr "/Applications/NexaShell.app"
              ```
          releaseDraft: false # 全自动发布：构建完成后直接公开，无需手动 Publish
          prerelease: false
          args: ${{ matrix.args }}
