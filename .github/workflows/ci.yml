name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + type-check + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint:check

      - name: Type-check
        run: |
          set +e
          echo "::error::DIAG node=$(node --version 2>&1)"
          echo "::error::DIAG bun=$(bun --version)"
          node node_modules/vue-tsc/bin/vue-tsc.js --noEmit --pretty false > /tmp/vtsc.log 2>&1
          rc=$?
          echo "::error::DIAG VUE_TSC_EXIT(node)=$rc"
          if [ -s /tmp/vtsc.log ]; then
            head -40 /tmp/vtsc.log | sed 's/^/::error::VTSCOUT /'
          else
            echo "::error::DIAG VUE_TSC_OUTPUT_EMPTY"
          fi
          exit $rc

      - name: Unit tests
        run: bun run test

  backend:
    name: Backend (cargo check + test + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
