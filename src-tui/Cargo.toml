[package]
name = "nexashell-tui"
version = "0.1.0"
description = "TUI frontend for NexaShell (SSH client)."
authors = ["ChengVar <chengver@gmail.com>"]
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssh2 = "0.9"
socket2 = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "io-util"] }
thiserror = "1"
rusqlite = { version = "0.29.0", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5.0"
once_cell = "1.19"
log = "0.4"
env_logger = "0.11"
keyring = "2"
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
rand = "0.8"
base64 = "0.21"
zeroize = { version = "1.7", features = ["derive"] }
ratatui = "0.29"
vt100 = "0.15"
arboard = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"

[dependencies.unicode-width]
version = "0.2"
